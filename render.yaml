# Render(render.com) 배포 설정.
# 대시보드에서 Blueprint 로 이 저장소를 연결하면 아래 내용대로 자동 설정됩니다.
services:
  - type: web
    name: kwak-hair-crm
    runtime: node
    region: singapore          # 한국에서 가장 가까운 지역
    plan: starter              # 자료를 보존하려면 디스크가 필요하고, 디스크는 유료 플랜에서만 붙습니다
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/me
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR         # DB와 사진을 아래 디스크에 저장 (재배포해도 유지됨)
        value: /var/data
      - key: SESSION_SECRET   # 로그인 쿠키 서명 키 (Render가 임의 값으로 자동 생성)
        generateValue: true
      - key: APP_PASSWORD     # 접속 비밀번호 - 배포할 때 직접 입력합니다
        sync: false
    disk:
      name: kwak-data
      mountPath: /var/data
      sizeGB: 1               # 고객 사진이 많아지면 나중에 늘릴 수 있습니다
